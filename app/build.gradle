plugins { id 'com.android.application' }
android {
    namespace 'io.github.flysky701.opencage'
    compileSdk 36
    buildToolsVersion '36.1.0'
    defaultConfig {
        applicationId 'io.github.flysky701.opencage'
        minSdk 28
        targetSdk 28
        versionCode 10020
        versionName '1.0.0-rc.3.18'
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}
dependencies { implementation project(':Bcore') }
